spring.application.name=heal-lots-api
server.port=8080

# Supabase / PostgreSQL
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/heallots}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:password}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false
spring.jpa.defer-datasource-initialization=true
spring.jpa.properties.hibernate.generate_statistics=false

# CORS
spring.web.cors.allowed-origins=http://localhost:3000,http://localhost:5173,https://heallots-frontend.onrender.com

# JWT
jwt.secret=${JWT_SECRET:your-default-secret-key}
jwt.expiration=${JWT_EXPIRATION:86400000}

# File Upload
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
server.tomcat.max-http-post-size=10485760

# Logging
logging.level.org.hibernate=WARN
logging.level.org.hibernate.SQL=DEBUG